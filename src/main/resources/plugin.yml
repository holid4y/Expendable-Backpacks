name: '${NAME}'
version: '${VERSION}'
main: '${PACKAGE}.ExpendableBackpacks'
api-version: '26.2'
author: Shweit
description: Expendable Backpacks - Expandable Storage for Minecraft! (FeatherFlux fork with personal backpacks and an upgrade tree)
folia-supported: false
softdepend: [packetevents, OriginsPaper, EvenMoreFish, Lootin, BreweryX, FeatherDiscos, JukeboxExtendedReborn]

commands:
  backpack:
    description: Main backpack command
    usage: |
      /backpack - Show crafting guide
      /backpack give <player> <tier> - Give a backpack
      /backpack open <uuid> - Open backpack by UUID
      /backpack clear <uuid> - Clear backpack contents
      /backpack clone <uuid> - Clone an Enderpack
    permission: backpack.use
    aliases: [bp]
  mochila:
    description: Abre a sua mochila e a árvore de melhorias.
    usage: /mochila [arvore | tocar | parar]
    permission: mochila.usar

permissions:
  mochila.usar:
    description: Ter a mochila pessoal no slot da hotbar e usar /mochila.
    default: true
  mochila.admin:
    description: /mochila ver, info e recarregar.
    default: op
  backpack.use:
    description: Use backpack command and open own backpacks
    default: op
  backpack.give:
    description: Give backpacks to players
    default: op
  backpack.openOthers:
    description: Open backpacks by UUID
    default: op
  backpack.clear:
    description: Clear backpack contents
    default: op
  backpack.clone:
    description: Clone Enderpacks
    default: op
  backpack.admin:
    description: All backpack admin permissions
    default: op
    children:
      backpack.use: true
      backpack.give: true
      backpack.openOthers: true
      backpack.clear: true
      backpack.clone: true
